name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore WinGetTray.sln

      - name: Build
        run: dotnet build WinGetTray.sln -c Release --no-restore

      - name: Test
        run: dotnet test WinGetTray.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Publish single-file exe
        run: dotnet publish src/WinGetTray/WinGetTray.csproj -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: WinGetTray-win-x64
          path: artifacts/WinGetTray.exe
          if-no-files-found: error
